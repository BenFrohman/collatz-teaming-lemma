name: Lean certificate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain = leanprover/lean4:v4.34.0)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          lake build
          lake build CollatzTeaming.ParentRule CollatzTeaming.Scenes CollatzTeaming.TerrasDensity CollatzTeaming.Derived
      - name: Axiom audit
        run: |
          set -o pipefail
          for f in AxiomAudit*.lean; do
            lake env lean "$f" 2>&1 | awk '/^[ \t]/{sub(/^[ \t]+/," ");printf "%s",$0;next} NR>1{print ""} {printf "%s",$0} END{print ""}' | tee "axioms_${f%.lean}.txt"
          done
      - name: Check axioms are standard only
        run: |
          OK='depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$|does not depend on any axioms$'
          for f in AxiomAudit*.lean; do
            a="axioms_${f%.lean}.txt"; test -s "$a"
            n=$(grep -c "^#print axioms" "$f"); m=$(grep -E "^'" "$a" | grep -cE "$OK" || true)
            echo "$f: audited $n declarations, $m with standard axioms only"
            if [ "$n" -ne "$m" ] || grep -iE "error|warning: declaration uses" "$a"; then
              echo "Non-standard axiom output:"; cat "$a"; exit 1; fi
          done
      - name: No sorry / no axiom declarations
        run: python3 scripts/check_no_sorry.py
